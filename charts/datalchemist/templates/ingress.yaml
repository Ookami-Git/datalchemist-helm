{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "datalchemist.fullname" . }}
  labels:
    {{- include "datalchemist.labels" . | nindent 4 }}
  annotations:
    # On force l'entrypoint web (HTTP) dans tous les cas
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
    {{- if .Values.ingress.tls.enabled }}
    # Si TLS est actif, on écrase/ajoute l'entrypoint websecure et l'activation TLS
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- end }}
    # On conserve la possibilité d'ajouter d'autres annotations à la volée depuis les values
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "datalchemist.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}